# Generate the Xcode project with XcodeGen: `brew install xcodegen && xcodegen`.
name: TextMe
options:
  bundleIdPrefix: app.textme
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  TextMe:
    type: application
    platform: iOS
    sources: [TextMe]
    info:
      path: TextMe/Info.plist
      properties:
        CFBundleDisplayName: Text Me
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The control plane the app hosts. Set per configuration in Config/*.xcconfig.
        ATTNBaseURL: $(ATTN_BASE_URL)
        CFBundleURLTypes:
          - CFBundleURLName: app.textme.deeplink
            CFBundleURLSchemes: [textme]
    entitlements:
      path: TextMe/TextMe.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.associated-domains: [applinks:$(ATTN_HOST)]
        # "Needs you" notifications break through Focus (the server marks them time-sensitive).
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATTN_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(ATTN_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
